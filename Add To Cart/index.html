<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>After add to bag: four concepts (boohooMAN / PLT / Debenhams)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Montserrat:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;600;700&family=Google+Sans:wght@400;500;700&family=Geologica:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E8EAED; --panel:#FFFFFF; --ink:#15171A; --muted:#5B616A; --line:#D2D6DB;
  --sel-bg:#15171A; --sel-ink:#FFFFFF; --focus:#2F6FEB;
  color-scheme:light;
  /* boohooMAN tokens, copied from the live page's :root */
  --color-primary:0 0 0; --color-text-secondary:118 118 118; --color-bg-grey:248 248 248;
  --color-button-secondary-border:181 181 181; --color-added-quick-add-text-colour:255 255 255;
  --markdown:#C8102E; --light-red:#FDECEC; --dark-red:#B3261E; --pill-grey:#E7E7E7; --usp-grey:#D3D3D3;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#15171A;--panel:#1F2226;--ink:#ECEEF0;--muted:#9AA1A9;--line:#343940;--sel-bg:#ECEEF0;--sel-ink:#15171A;--focus:#7FA8FF;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#15171A;--panel:#1F2226;--ink:#ECEEF0;--muted:#9AA1A9;--line:#343940;--sel-bg:#ECEEF0;--sel-ink:#15171A;--focus:#7FA8FF;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}

button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- device frames ---------- */
.device{position:relative;background:#fff;color:#000;overflow:hidden;overflow:clip;font-family:Montserrat,"Helvetica Neue",Arial,sans-serif;font-size:16px;box-shadow:0 0 0 1px var(--line)}
.device.mobile{width:390px;height:800px;border-radius:36px;border:10px solid #1b1c1e;flex:none}
.device.desktop{width:1060px;height:660px;border-radius:10px;flex:none}
.site{position:absolute;inset:0;overflow-y:auto}

/* site header (from main-header) */
.sh{position:sticky;top:0;z-index:5;background:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px}
.wordmark{font-weight:700;letter-spacing:.16em;font-size:14px;flex:1}
.desktop .wordmark{font-size:19px;flex:0 0 auto;margin-right:28px}
.searchbar{display:none}
.desktop .searchbar{display:flex;flex:1;height:44px;border-radius:999px;background:rgb(242 242 242);align-items:center;padding:0 18px;color:rgb(118 118 118);font-weight:300;font-size:14px}
.icons{display:flex;gap:14px;align-items:center}
.icon{width:22px;height:22px;display:block}
.bagbtn{position:relative;border:0;background:none;padding:0}
.badge{position:absolute;top:-2px;right:-3px;width:13px;height:13px;border-radius:50%;background:#000;color:#fff;font-size:9px;display:grid;place-items:center}
.badge.bump{animation:bump .45s ease}
@keyframes bump{40%{transform:scale(1.6)}}
.usp{background:#000;color:#fff;text-align:center;font-size:12px;font-weight:700;padding:7px 8px 6px;line-height:1.35}
.usp span{display:block;color:#f00;font-weight:400}
.usp2{background:var(--usp-grey);text-align:center;font-size:12px;font-weight:700;padding:7px;line-height:1.35}
.usp2 span{display:block;font-weight:400}

/* PDP (from the live mobile PDP) */
.gallery{display:flex;gap:8px;overflow:hidden;position:relative}
.gallery img{width:66.6%;flex:none;aspect-ratio:2/3;object-fit:cover;display:block;background:#f2f2f2}
.pill{position:absolute;left:12px;font-weight:300;font-size:13px;padding:7px 8px;border-radius:4px;background:var(--pill-grey)}
.pdp-body{padding:16px;display:flex;flex-direction:column;gap:14px}
.brand{font-weight:600;font-size:16px}
.pname{font-weight:300;font-size:16px;margin-top:2px}
.prices{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.price{font-weight:600;color:var(--markdown);font-size:24px;line-height:1}
.was{font-weight:300;color:rgb(118 118 118);text-decoration:line-through;font-size:20px}
.save{font-size:14px;background:var(--light-red);color:var(--markdown);padding:8px;border-radius:4px;line-height:1}
.dlv{font-size:14px}
.dlv b{font-weight:600}
.lbl{font-weight:300}
.lbl b{font-weight:500}
.sizes{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sz{min-width:53px;height:50px;border:1px solid #d6d6d6;border-radius:4px;background:#fff;font-family:inherit;font-size:16px;padding:0 6px}
.sz[aria-pressed="true"]{border-color:#000}
.sz.low{color:rgb(118 118 118)}
.stock{color:var(--dark-red);font-size:15px}
.atb{width:100%;height:50px;border:0;border-radius:4px;background:#000;color:#fff;font-weight:600;text-transform:uppercase;font-family:inherit;font-size:14px;letter-spacing:.02em}
.atb:hover{background:rgb(0 0 0 / .75)}
.desktop .pdp{display:grid;grid-template-columns:1fr 360px;gap:32px;padding:20px 40px}
.desktop .gallery img{width:calc(50% - 4px)}
.desktop .pdp-body{padding:0}

/* overlay */
.scrim{position:absolute;inset:0;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;background:rgba(0,0,0,.45)}
.desktop .scrim{background:#fff}
.scrim.on{opacity:1;pointer-events:auto}
.desktop .scrim.on{opacity:.75}
.sheet{position:absolute;z-index:21;background:#fff;display:flex;flex-direction:column;visibility:hidden;transition:transform .2s ease-out,visibility 0s linear .2s}
.mobile .sheet{left:0;right:0;bottom:0;max-height:90%;transform:translateY(105%)}
.desktop .sheet{top:0;right:0;bottom:0;width:500px;transform:translateX(105%)}
.desktop .sheet::before{content:"";position:absolute;top:0;bottom:0;left:-128px;width:128px;background:linear-gradient(to left,rgba(0,0,0,.06),transparent);pointer-events:none}
.sheet.on{transform:none;visibility:visible;transition:transform .2s ease-out,visibility 0s}
.sheet-inner{overflow-y:auto;padding:20px 20px 24px;position:relative}
.desktop .sheet-inner{padding:40px}
.x{position:absolute;top:0;right:0;width:40px;height:40px;border:0;background:none;display:grid;place-items:center}
.mobile .x{top:12px;right:8px}
.sheet h4{margin:0 0 18px;font-weight:600;font-size:22px}
.desktop .sheet h4{font-weight:400;font-size:30px;margin-bottom:40px}
.desktop .sheet h4.small{font-size:22px;font-weight:600;margin-bottom:20px}
.added-check{display:flex;align-items:center;gap:8px}
.added-check svg{width:22px;height:22px}

/* item rows */
.big-item{display:flex;gap:20px;margin:0 0 24px}
.big-item img{width:110px;aspect-ratio:2/3;object-fit:cover}
.desktop .big-item img{width:150px}
.meta{display:flex;flex-direction:column;padding:0 4px;font-size:16px}
.meta b{font-weight:600}
.meta .var{margin-top:24px}
.mini-price{font-size:13px;margin-top:4px}
.mini-price b{font-weight:600}
.mini-price s{margin-left:4px}
.compact{display:flex;align-items:center;gap:12px;padding:10px;background:rgb(248 248 248);border-radius:4px;margin-bottom:14px}
.compact img{width:44px;aspect-ratio:2/3;object-fit:cover;flex:none}
.compact .t{font-size:13px;line-height:1.35;min-width:0}
.compact .t span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:300}
.compact .t small{display:block;margin-top:3px;font-size:12.5px}

/* buttons (from added-to-cart-continue-btn / view-bag-btn) */
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:50px;border-radius:4px;font-family:inherit;font-weight:600;text-transform:uppercase;font-size:14px;letter-spacing:.02em}
.btn-o{border:1px solid rgb(181 181 181);background:#fff;color:#000}
.btn-o:hover{color:rgb(118 118 118)}
.btn-p{border:0;background:#000;color:#fff}
.btn-p:hover{background:rgb(0 0 0 / .75)}
.btn+.btn{margin-top:8px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-row .btn+.btn{margin-top:0}
.btn-row{grid-template-columns:1fr 1fr}
.textlink{display:block;width:100%;margin-top:12px;border:0;background:none;font-family:inherit;font-size:14px;font-weight:500;text-decoration:underline;text-underline-offset:3px;color:#000;text-align:center;padding:4px}
.textlink:hover{color:rgb(118 118 118)}
.conf{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;margin-bottom:4px}
.conf svg{width:15px;height:15px}
.meta .conf{font-size:14px;margin-bottom:8px}
.mobile .merged .compact,.mobile .merged .big-item{margin-right:34px}

/* recs, styled after the product card */
.recs-h{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 12px}
.recs-h b{font-size:18px;font-weight:600;letter-spacing:.01em}
.recs-h small{font-size:12px;color:rgb(118 118 118)}
.recs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:20px;margin:0 -20px;padding:0 20px 6px}
.desktop .recs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;overflow:visible;margin:0;padding:0}
.tile{flex:0 0 142px;scroll-snap-align:start}
.tile .art{position:relative;aspect-ratio:2/3;background:#f2f2f2;overflow:hidden}
.tile .art img{width:100%;height:100%;object-fit:cover;display:block}
.tile .br{font-size:12px;font-weight:600;margin-top:8px}
.tile .nm{font-size:12px;font-weight:300;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .pr{font-size:13px;font-weight:600;margin-top:2px}
.tag{position:absolute;left:6px;top:6px;background:#000;color:#fff;font-size:10px;font-weight:600;padding:4px 6px;border-radius:3px}
.tallpill{position:absolute;left:6px;bottom:6px;background:var(--pill-grey);font-size:10px;font-weight:300;padding:3px 6px;border-radius:3px}
.qa{position:absolute;right:6px;bottom:6px;width:34px;height:34px;border-radius:50%;border:0;background:#fff;box-shadow:0 0 14px -4px rgba(0,0,0,.35);display:grid;place-items:center}
.qa svg{width:16px;height:16px}
.picker{position:absolute;inset:auto 0 0 0;background:rgba(255,255,255,.97);padding:8px 6px 6px}
.picker p{margin:0 0 6px;font-size:11px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.picker p button{border:0;background:none;padding:0 2px;font-size:13px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid #d6d6d6;border-radius:3px;background:#fff;font-family:inherit;font-size:11px;padding:6px 0;flex:1 0 28%}
.chip.suggest{border-color:#000}
.done{position:absolute;inset:auto 0 0 0;background:#000;color:rgb(255 255 255);font-size:11px;font-weight:600;padding:8px;display:flex;align-items:center;gap:6px}
.done svg{width:14px;height:14px}

/* delivery progress */
.thresh{border:1px solid #e7e7e7;border-radius:4px;padding:12px 12px 14px;margin-bottom:12px}
.thresh p{margin:0 0 8px;font-size:13.5px}
.thresh p b{font-weight:600}
.bar{height:6px;background:#e7e7e7;border-radius:999px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:#000;border-radius:999px;transition:width .4s ease}
.thresh.met .bar i{background:#1E7B45}
.thresh.met p{color:#1E7B45;font-weight:600}
.subtotal{display:flex;justify-content:space-between;font-size:13px;margin:0 0 14px}
.subtotal b{font-weight:600}

/* toast */
.toast{position:absolute;z-index:22;background:#fff;color:#000;display:flex;align-items:center;gap:10px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.16);border-radius:4px;opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .2s,transform .2s}
.mobile .toast{left:10px;right:10px;top:52px}
.desktop .toast{right:24px;top:72px;width:360px}
.toast.on{opacity:1;visibility:visible;transform:none}
.toast img{width:34px;aspect-ratio:2/3;object-fit:cover}
.toast .t{flex:1;font-size:13px;line-height:1.35}
.toast .t b{display:block;font-weight:600}
.toast a{font-size:13px;font-weight:600;text-decoration:underline;color:#000;cursor:pointer;white-space:nowrap}
.toast .timer{position:absolute;left:0;bottom:0;height:2px;background:#000;width:100%}
.toast.on .timer{animation:drain 4s linear forwards}
@keyframes drain{to{width:0}}

.bag-list{list-style:none;margin:0 0 16px;padding:0}
.bag-list li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:10px 0;border-bottom:1px solid #eee;font-weight:300}
.bag-list li small{display:block;color:rgb(118 118 118)}
.bag-list li b{font-weight:600}
.empty{font-size:14px;color:rgb(118 118 118)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- PLT theme: tokens from the live PLT page :root ---------- */
.device.plt{--plt-primary:#550503;--plt-bg:#FFFDF7;--plt-cream:#FAF5E7;--plt-red:#C90000;--plt-text:#333;background:var(--plt-bg);color:var(--plt-text);font-family:Roboto,"Helvetica Neue",Arial,sans-serif;font-size:12px}
.plt .sh{background:var(--plt-bg)}
.plt .wordmark{letter-spacing:.04em;font-size:13px;color:#000}
.plt.desktop .wordmark{font-size:17px}
.plt .desktop .searchbar,.plt.desktop .searchbar{background:transparent;border-bottom:1px solid #000;border-radius:0;color:#767676;font-size:12px;text-transform:uppercase}
.plt .usp{background:#f1c59e;color:#000;font-size:12px}
.plt .usp span{color:#000;font-weight:400}
.plt .usp2{background:#ffe4d2;font-size:12px}
.plt .pill{display:none}
.plt .pdp-body{gap:12px}
.plt .pname{text-transform:uppercase;font-weight:300;font-size:12px;margin:0}
.plt .price{color:var(--plt-red);font-size:16px;font-weight:600}
.plt .was{font-size:16px;color:#767676}
.plt .save{background:none;padding:0;color:var(--plt-red);font-size:14px}
.plt .codebadge{color:var(--plt-red);font-size:12px}
.plt .dlv,.plt .lbl{font-size:12px}
.plt .sz{width:40px;min-width:40px;height:40px;border-radius:0;font-size:12px;background:transparent;border-color:#b5b5b5}
.plt .sz[aria-pressed="true"]{border-color:#000}
.plt .atb,.plt .btn{border-radius:0;font-weight:400;font-size:14px}
.plt .atb,.plt .btn-p{background:var(--plt-primary)}
.plt .atb:hover,.plt .btn-p:hover{background:rgb(85 5 3 / .75)}
.plt .btn-o{background:transparent;color:#333}
.plt .textlink{color:#333}
.plt .scrim,.plt.desktop .scrim{background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.plt.desktop .scrim.on{opacity:1}
.plt .sheet,.plt .toast{background:var(--plt-bg)}
.plt .sheet h4,.plt.desktop .sheet h4,.plt.desktop .sheet h4.small{font-size:16px;font-weight:400;margin-bottom:16px}
/* the live PLT sheet has no desktop breakpoint: it stays a full-width bottom sheet */
.plt.desktop .sheet{top:auto;left:0;right:0;bottom:0;width:auto;max-height:86%;transform:translateY(105%)}
.plt.desktop .sheet::before{display:none}
.plt.desktop .sheet.on{transform:none}
.plt.desktop .sheet-inner{padding:24px 40px 28px;width:100%;max-width:1000px;margin:0 auto}
.plt.desktop .sheet-inner .x{right:0;top:0}
.cols{display:grid;grid-template-columns:340px minmax(0,1fr);gap:40px;align-items:start}
.cols .recs-h{margin-top:4px;padding-right:44px}
.plt .big-item{margin-left:24px}
.plt .meta{font-size:12px;text-transform:uppercase}
.plt .meta .var{text-transform:none}
.plt .compact{background:var(--plt-cream);border-radius:0}
.plt .compact .t,.plt .compact .t small{font-size:12px}
.plt .compact .t span{text-transform:uppercase}
.plt .recs-h b{font-size:16px;font-weight:600}
.plt .tile .art{background:#EFE9DA}
.plt .tile .nm{text-transform:uppercase;font-size:12px;margin-top:8px}
.plt .tile .pr{font-size:12px}
.plt .tag{border-radius:0;background:var(--plt-primary)}
.plt .chip{border-radius:0;font-size:11px}
.plt .picker{background:rgba(255,253,247,.97)}
.plt .done{background:var(--plt-primary)}
.plt .thresh{border-color:#e6dec9;border-radius:0;background:var(--plt-cream)}
.plt .bar{background:#e6dec9}
.plt .bar i{background:var(--plt-primary)}
.plt .toast{border-radius:0}
.plt .toast .timer{background:var(--plt-primary)}
.plt .toast a,.plt .bag-list li b{color:#333}
.plt .badge{background:#000;width:12px;height:12px;font-size:9px;top:-4px;right:-4px}
.plt .bag-list li{border-color:#ece5d3}

/* save your bag */
.savecard{margin-top:18px;padding:16px;border:1px solid #e7e7e7;border-radius:4px;background:#fff}
.sc-h{margin:0 0 4px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.sc-h svg{width:18px;height:18px;flex:none}
.sc-s{margin:0 0 12px;font-size:13px;font-weight:300;line-height:1.4}
.sc-in{width:100%;height:48px;border:1px solid #b5b5b5;border-radius:4px;padding:0 14px;font:inherit;font-size:16px;font-weight:300;background:#fff;color:#000}
.sc-in:focus{outline:none;border-color:#000}
.sc-in[aria-invalid="true"]{border-color:#B3261E}
.sc-err{margin:6px 0 0;font-size:12.5px;color:#B3261E}
.sc-opt{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:13px;line-height:1.4;font-weight:300;cursor:pointer}
.sc-opt input{width:18px;height:18px;margin:1px 0 0;flex:none;accent-color:#000}
.sc-legal{margin:10px 0 0;font-size:11.5px;color:rgb(118 118 118);line-height:1.4}
.sc-legal a{color:inherit}
.linkbtn{border:0;background:none;padding:0;font:inherit;text-decoration:underline;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.acct{margin-top:14px;display:flex;align-items:center;gap:6px;font-size:13px}
.acct svg{width:16px;height:16px}
.desktop .savecard{margin-top:24px}
.plt .savecard{border-radius:0;background:var(--plt-cream);border-color:#e6dec9}
.plt .sc-h{font-size:14px;font-weight:500}
.plt .sc-s,.plt .sc-opt{font-size:12px}
.plt .sc-in{border-radius:0;background:var(--plt-bg);font-size:16px}
.plt .sc-opt input{accent-color:var(--plt-primary)}
.plt .cols .savecard{margin-top:0}


/* ---------- Debenhams theme: tokens from the live Debenhams page :root ---------- */
.device.deb{font-family:Geologica,"Helvetica Neue",Arial,sans-serif}
.deb .logo{height:15px;width:auto;display:block}
.deb.desktop .logo{height:22px}
.deb .usp{background:#000;color:#fff;font-weight:400}
.deb .usp2{background:#f8f8f8;font-weight:700}
.deb .usp2 span{text-decoration:underline;font-weight:400}
.deb .price{color:#000;font-size:24px}
.deb .atb,.deb .btn-p{background:rgb(123 231 216);color:#000}
.deb .atb:hover,.deb .btn-p:hover{background:rgb(123 231 216 / .75)}
.deb .done{background:#000}
.deb .thresh .bar i{background:rgb(0 120 125)}
.deb.mobile .scrim{background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
.dtb{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:300;margin:0 0 20px}
.desktop .dtb{justify-content:center}
.dtb-i{width:18px;height:18px;flex:none}
.spons{font-size:10px;color:rgb(118 118 118);margin-top:8px;letter-spacing:.02em}
.spons+.br{margin-top:2px}

/* ============================================================
   Review shell, after Jake's standard prototype format (shopping-agent configurator).
   TOP BAR: fascia chips · Desktop/Mobile · width preset · live width · Full page/Fold · Export.
   LEFT PANEL: configuration + commentary. STAGE: the page, drag handle on its right edge.
   ============================================================ */
body{--rs-bg:#161616;--rs-bar:#000;--rs-line:rgba(255,255,255,.14);--rs-ink:#F7F7F7;--rs-muted:#9A9A9A;--rs-dim:#808080;--rs-accent:#0D99FF;--rs-warn:#E8A23B;
  margin:0;background:var(--rs-bg);font-family:'Google Sans','Montserrat',system-ui,sans-serif;color:var(--rs-muted);display:grid;grid-template-rows:48px 1fr;grid-template-columns:360px 1fr;height:100vh;height:100dvh;overflow:hidden;font-size:12px;line-height:1.4}
html{height:100%}
.rs-top{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--rs-bar);border-bottom:1px solid var(--rs-line);min-width:0}
.rs-ttl{font-weight:600;font-size:12px;color:var(--rs-ink);white-space:nowrap}
.rs-mid{margin:0 auto;display:flex;align-items:center;gap:10px;min-width:0}
.rs-div{width:1px;height:20px;background:rgba(255,255,255,.15);margin:0 4px;flex:none}
.rs-w{font-size:10.5px;color:var(--rs-dim);font-variant-numeric:tabular-nums;min-width:64px;text-align:right;white-space:nowrap}
.rs-status{font-size:11px;color:var(--rs-muted);white-space:nowrap}
.rs-top select,.rs-panel select,.rs-panel input{background:#161616;color:var(--rs-ink);border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:4px 8px;font:inherit;font-size:11.5px}
.rs-export{display:flex;align-items:center;gap:8px;background:var(--rs-ink);color:#000;padding:6px 12px;border-radius:99px;font-weight:600;font-size:12px;flex:none;border:0;cursor:pointer;font-family:inherit}
.rs-export:disabled{opacity:.5;cursor:progress}.rs-export svg{width:13px;height:13px}
.rs-seg{display:inline-flex;border:1px solid rgba(255,255,255,.25);border-radius:99px;overflow:hidden;flex:none}
.rs-seg button{padding:5px 12px;color:#B0B0B0;font-size:11.5px;white-space:nowrap;background:none;border:0;font-family:inherit;cursor:pointer}
.rs-seg button.on{background:var(--rs-ink);color:#000;font-weight:700}
.rs-seg button:disabled{opacity:.35;cursor:not-allowed}
.rs-chips{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-width:0}
.rs-chip{padding:5px 11px;border-radius:99px;border:1px solid rgba(255,255,255,.2);font-size:11.5px;color:#B0B0B0;white-space:nowrap;background:none;font-family:inherit;cursor:pointer;flex:none}
.rs-chip.on{background:var(--rs-ink);color:#000;border-color:var(--rs-ink);font-weight:600}
.rs-chip[disabled]{opacity:.35;cursor:not-allowed}
.rs-top :focus-visible,.rs-panel :focus-visible{outline:2px solid var(--rs-accent);outline-offset:2px}
/* left panel */
.rs-panel{background:#000;border-right:1px solid var(--rs-line);overflow-y:auto;padding:16px 14px 40px;min-height:0}
.rs-panel h1{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:4px 0;color:var(--rs-ink)}
.rs-intro{font-size:11px;color:var(--rs-dim);line-height:1.45;margin:0 0 14px}
.rs-card{border:1px solid var(--rs-line);border-radius:10px;padding:12px;margin-bottom:10px;background:#0E0E0E}
.rs-card h3{font-size:12.5px;font-weight:600;color:var(--rs-ink);display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;gap:8px}
.rs-card h3 small{font-weight:400;color:var(--rs-dim);font-size:10.5px}
.rs-card p{font-size:11.5px;color:#B4B4B4;line-height:1.5;margin:0 0 8px}
.rs-card p:last-child{margin-bottom:0}
.rs-card ul{margin:0;padding-left:15px}
.rs-card li{font-size:11.5px;color:#B4B4B4;line-height:1.5}
.rs-card li+li{margin-top:5px}
.rs-card b{color:#D8D8D8;font-weight:600}
.rs-card code{font:10.5px ui-monospace,Menlo,monospace;color:#9FD3FF}
.rs-card a{color:var(--rs-accent)}
.rs-card.lead{background:#0B1A26;border-color:rgba(13,153,255,.35)}
.rs-card.lead p{color:#D8D8D8;font-size:12px}
.rs-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--rs-dim);margin:18px 2px 8px}
.rs-opt{display:flex;align-items:flex-start;gap:10px;padding:7px 0;cursor:pointer;border:0;border-top:1px solid rgba(255,255,255,.07);width:100%;text-align:left;background:none;font-family:inherit;color:inherit}
.rs-opt:first-of-type{border-top:none}
.rs-opt .r{flex:none;width:16px;height:16px;border-radius:99px;border:1.5px solid #6A6A6A;margin-top:1px;position:relative}
.rs-opt.on .r{border-color:var(--rs-accent);background:var(--rs-accent)}
.rs-opt.on .r::after{content:"";position:absolute;inset:4px;border-radius:99px;background:#0A0A0A}
.rs-opt .t{flex:1;min-width:0}.rs-opt .t b{display:block;font-size:12px;font-weight:500;color:#D8D8D8}.rs-opt.on .t b{font-weight:600;color:var(--rs-ink)}
.rs-opt .t span{display:block;font-size:10.5px;color:var(--rs-dim);line-height:1.4}
.rs-f{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.rs-f:first-of-type{margin-top:0}
.rs-f>span{font-size:11px;color:#C8C8C8;font-weight:500}
.rs-f small{font-size:10.5px;color:var(--rs-dim);line-height:1.45}.rs-f small.warn{color:var(--rs-warn)}
.rs-f .rs-seg{align-self:flex-start}
.rs-f .rs-seg button{padding:5px 10px}
.rs-f input{width:110px}
.rs-ghost{align-self:flex-start;border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:5px 12px;color:var(--rs-ink);background:none;font:inherit;font-size:11.5px;cursor:pointer}
/* stage: frame + drag handle */
.rs-stage{position:relative;overflow:hidden;display:flex;align-items:stretch;justify-content:center;min-width:0;min-height:0}
.rs-win{display:flex;height:100%;max-width:100%}
.rs-box{position:relative;flex:none;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.5);background:#FFF}
.rs-frame{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;flex-direction:column;background:#FFF}
.rs-frame>.device{flex:1;min-height:0;width:100%!important;height:auto!important;border:0!important;border-radius:0!important;box-shadow:none!important}
.rs-handle{width:16px;display:flex;align-items:center;justify-content:center;cursor:col-resize;flex:none;touch-action:none}
.rs-handle i{width:5px;height:56px;border-radius:99px;background:#3A3A3A}
.rs-handle:hover i,body.dragging .rs-handle i{background:#6A6A6A}
body.dragging{user-select:none;cursor:col-resize}
/* fold view: iPhone Safari frame */
.rs-sb,.rs-tb,.rs-home,.rs-chin{display:none}
body.fold .rs-stage{align-items:center}body.fold .rs-win{height:auto}
body.fold .rs-box{border-radius:calc(var(--k) * 44px)}
body.fold .rs-sb,body.fold .rs-tb,body.fold .rs-home{display:flex}
body.fold .rs-chin{display:block;flex:none;height:82px;background:#FFF}
.rs-sb{height:62px;flex:none;background:#FFF;position:relative;align-items:center;justify-content:space-between;padding:0 30px 0 48px;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif}
.rs-sb .time{font-size:17px;font-weight:600;color:#000;letter-spacing:-.02em;width:54px}
.rs-sb .island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:124px;height:36px;background:#000;border-radius:99px}
.rs-sb .sys{display:flex;align-items:center;gap:6px}
.rs-sb .sig{width:18px;height:12px}.rs-sb .wifi{width:16px;height:12px}.rs-sb .bat{width:28px;height:13px}
.rs-tb{position:absolute;left:0;right:0;bottom:34px;height:48px;padding:0 28px;align-items:center;justify-content:space-between;gap:8px;pointer-events:none;z-index:40}
.rs-tb .circ{width:48px;height:48px;border-radius:99px;background:rgba(255,255,255,.92);box-shadow:0 1px 6px rgba(0,0,0,.18);display:grid;place-items:center;flex:none}
.rs-tb .circ svg{width:12px;height:20px}.rs-tb .circ:last-child svg{width:22px;height:6px}
.rs-tb .url{flex:1;height:48px;border-radius:99px;background:rgba(255,255,255,.92);box-shadow:0 1px 6px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;font-size:17px;color:#000}
.rs-tb .url .pg{width:20px;height:18px}.rs-tb .url .rl{width:20px;height:20px}
.rs-home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:99px;background:#000;z-index:41}
/* export overlay */
#rsExp{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100}
#rsExp[hidden]{display:none}
#rsExp .box{background:#0A0A0A;border:1px solid var(--rs-line);color:#FFF;padding:16px 22px;border-radius:12px;font-size:13px;display:flex;gap:12px;align-items:center;max-width:420px}
#rsExp .sp{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#FFF;border-radius:99px;animation:rssp .8s linear infinite;flex:none}
@keyframes rssp{to{transform:rotate(360deg)}}
/* phones: page fills the window; the panel slides over it from a settings tab */
#rsTab,.rs-mhead{display:none}
@media(max-width:760px){
  body{grid-template-columns:1fr;grid-template-rows:1fr}.rs-top{display:none}
  .rs-win,.rs-box{width:100%!important;height:100%!important}.rs-box{box-shadow:none}.rs-handle{display:none!important}
  .rs-frame{width:100%!important;height:100%!important;transform:none!important}
  #rsTab{display:grid;place-items:center;position:fixed;left:0;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:70;width:44px;height:44px;background:#000;color:#FFF;border:0;border-radius:0 12px 12px 0;box-shadow:0 2px 10px rgba(0,0,0,.35)}
  #rsTab svg{width:22px;height:22px}
  .rs-panel{position:fixed;inset:0;z-index:80;border-right:none;transform:translateX(-100%);transition:transform .25s ease;padding-top:calc(env(safe-area-inset-top,0px) + 12px)}.rs-panel.open{transform:none}
  .rs-mhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}.rs-mhead .rs-chips{flex:1}
  .rs-mclose{flex:none;width:32px;height:32px;border-radius:99px;border:1px solid rgba(255,255,255,.3);color:var(--rs-ink);background:none}
}
.badge[hidden]{display:none}

    }).catch(function(err){frame.style.transform=t;$('status').textContent='Export failed';console.error(err)}).then(function(){btn.disabled=false;ov.hidden=true});
  });

  document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeSheet();$('panel').classList.remove('open')}});
  var start='bm';try{var q=new URL(location.href).searchParams.get('brand');FASCIAS.forEach(function(f){if(f[0]===q&&f[2])start=f[2]})}catch(e){}
  layout();setBrand(start,false);
})();
</script>
